name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lifeos
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lifeos:lifeos@localhost:5432/lifeos
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check --fail-level WARNING
      - name: Tests (PostgreSQL)
        run: python -m pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file schema.yml
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/schema.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        run: pip install pip-audit && pip-audit -r backend/requirements/base.txt
      - name: Bandit
        run: pip install bandit && bandit -q -ll -r backend/apps backend/common backend/config -x '*/tests/*'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Install on the runner BEFORE starting compose: the frontend container mounts a
      # volume at frontend/node_modules, and Docker would create that dir as root,
      # making a later host-side `npm ci` fail with EACCES.
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start stack
        env:
          THROTTLE_AUTH: 1000/min # each scenario registers its own user
          AI_ENABLED: "true"
          AI_PROVIDER: fake # scripted assistant, no network and no API key
        run: docker compose -f infra/compose/docker-compose.yml up -d --build --wait backend frontend
      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:5173 >/dev/null && exit 0; sleep 2; done
          docker compose -f infra/compose/docker-compose.yml logs; exit 1
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v

  images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          # Links the ghcr package to this repository; without the link GITHUB_TOKEN
          # is denied when writing the manifest.
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for app in backend frontend; do
            IMAGE=ghcr.io/$OWNER/lifeos-$app
            docker build -f infra/docker/Dockerfile.$app --target prod \
              --label org.opencontainers.image.source=$SOURCE \
              --label org.opencontainers.image.revision=${{ github.sha }} \
              -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
            docker push $IMAGE:${{ github.sha }}
            docker push $IMAGE:latest
          done
