# Local development: `make up` (or: docker compose -f infra/compose/docker-compose.yml up --build)
name: lifeos

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.local
  DATABASE_URL: postgres://lifeos:lifeos@db:5432/lifeos
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"

x-backend-build: &backend-build
  context: ../..
  dockerfile: infra/docker/Dockerfile.backend
  target: dev

# All backend services share one dev image. The explicit name keeps it apart from the
# production image (lifeos-backend:latest) that docker-compose.prod.yml uses by default.
x-backend-image: &backend-image lifeos-dev-backend:latest

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: *backend-build
    image: *backend-image
    environment: *backend-env
    command: python manage.py migrate --noinput
    volumes: ["../../backend:/app"]
    depends_on:
      db: { condition: service_healthy }

  backend:
    build: *backend-build
    image: *backend-image
    environment: *backend-env
    ports: ["8000:8000"]
    volumes: ["../../backend:/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready/"]
      interval: 10s
      retries: 10

  worker:
    build: *backend-build
    image: *backend-image
    environment: *backend-env
    command: celery -A config worker -Q default,ai,reports -l info
    volumes: ["../../backend:/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    build: *backend-build
    image: *backend-image
    environment: *backend-env
    command: celery -A config beat -l info
    volumes: ["../../backend:/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
  frontend_node_modules:
